
name: Build Bajrang Tally APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          DEST="$RUNNER_TEMP/bajrang-project"
          PROJECT=""

          if [ -d "$ROOT/app" ] && \
             { [ -f "$ROOT/settings.gradle" ] || \
               [ -f "$ROOT/settings.gradle.kts" ]; }; then
            PROJECT="$ROOT"
          else
            ZIP="$(find "$ROOT" -maxdepth 1 -type f \
              -iname 'BajrangTally*.zip' -print -quit)"

            if [ -z "$ZIP" ]; then
              echo "::error::BajrangTally ZIP not found."
              ls -la "$ROOT"
              exit 1
            fi

            mkdir -p "$DEST"
            unzip -oq "$ZIP" -d "$DEST"

            PROJECT="$(find "$DEST" -type f \
              \( -name settings.gradle \
                 -o -name settings.gradle.kts \) \
              -print -quit | xargs -r dirname)"

            if [ -z "$PROJECT" ] || [ ! -d "$PROJECT/app" ]; then
              echo "::error::Android app module not found in ZIP."
              find "$DEST" -maxdepth 5 -type f | head -100
              exit 1
            fi
          fi

          echo "Project: $PROJECT"
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          ls -la "$PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found."
            exit 1
          fi

          MANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print 2>/dev/null \
            | sort -V | tail -n 1)"

          if [ -z "$MANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "SDK=$SDK"
          echo "manager=$MANAGER" >> "$GITHUB_OUTPUT"

      - name: Accept Android SDK licenses
        shell: bash
        env:
          SDKMANAGER: ${{ steps.sdk.outputs.manager }}
        run: |
          set -euo pipefail

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          RESULT=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::SDK license acceptance failed."
            exit "$RESULT"
          fi

      - name: Install Android SDK packages
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          SDKMANAGER: ${{ steps.sdk.outputs.manager }}
        run: |
          set -euo pipefail

          CONFIG="app/build.gradle.kts"
          if [ ! -f "$CONFIG" ]; then
            CONFIG="app/build.gradle"
          fi

          COMPILE_SDK="$(grep -E \
            'compileSdk(Version)?[[:space:]]*[=(]?[[:space:]]*[0-9]+' \
            "$CONFIG" | grep -oE '[0-9]+' | head -n 1 || true)"

          if [ -z "$COMPILE_SDK" ]; then
            echo "::error::Could not detect compileSdk in $CONFIG"
            exit 1
          fi

          echo "Installing Android platform $COMPILE_SDK"

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-$COMPILE_SDK"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        env:
          PROJECT: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK missing or empty."
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bajrang-tally-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
