name: Build Bajrang Tally APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: ls -la

      - name: Find and prepare Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT_DIR=""

          if [ -f "$ROOT/settings.gradle.kts" ] && [ -d "$ROOT/app" ]; then
            PROJECT_DIR="$ROOT"
          elif [ -f "$ROOT/settings.gradle" ] && [ -d "$ROOT/app" ]; then
            PROJECT_DIR="$ROOT"
          else
            ZIP="$(find "$ROOT" -maxdepth 1 -type f \
              -iname 'BajrangTally*.zip' -print -quit)"

            if [ -z "$ZIP" ]; then
              echo "::error::BajrangTally ZIP not found in repository root."
              find "$ROOT" -maxdepth 2 -type f | head -100
              exit 1
            fi

            DEST="$RUNNER_TEMP/bajrang-tally-project"
            mkdir -p "$DEST"
            unzip -oq "$ZIP" -d "$DEST"

            PROJECT_DIR="$(find "$DEST" -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -print -quit | xargs -r dirname)"

            if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
              echo "::error::Could not find Gradle Android app module in ZIP."
              find "$DEST" -maxdepth 5 -type f | head -150
              exit 1
            fi
          fi

          echo "Android project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f \
              -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          RESULT=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed."
            exit "$RESULT"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -maxdepth 5 -type f \
              2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bajrang-tally-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
