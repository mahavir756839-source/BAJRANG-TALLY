name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 1 -name 'BajrangTally*.zip' | head -n 1)
          echo "Zip file mili: $ZIP"
          test -n "$ZIP"
          unzip -oq "$ZIP" -d .
          ls -la BajrangTally

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: BajrangTally
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: bajrang-tally-apk
          path: BajrangTally/app/build/outputs/apk/debug/app-debug.apk
