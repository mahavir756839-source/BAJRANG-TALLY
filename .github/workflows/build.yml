name: Build Bajrang Tally APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and prepare Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ] &&
             [ -d "$GITHUB_WORKSPACE/app" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 1 \
              -type f -iname 'BajrangTally*.zip' -print -quit)"

            if [ -z "$ZIP" ]; then
              echo "::error::BajrangTally ZIP or Android project files not found."
              ls -la "$GITHUB_WORKSPACE"
              exit 1
            fi

            DEST="$RUNNER_TEMP/bajrang-project"
            mkdir -p "$DEST"
            unzip -oq "$ZIP" -d "$DEST"

            PROJECT_DIR="$(find "$DEST" -type f \
              -name settings.gradle.kts -print -quit | xargs -r dirname)"

            if [ -z "$PROJECT_DIR" ] ||
               [ ! -d "$PROJECT_DIR/app" ]; then
              echo "::error::Android project folder or app module not found."
              find "$DEST" -maxdepth 4 -type f | head -100
              exit 1
            fi
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bajrang-tally-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
